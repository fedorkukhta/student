server:
  port: ${PORT:8080}

spring:
  main:
    allow-circular-references: true
  application:
    name: student
  jpa:
    hibernate.ddl-auto: ${DDL_AUTO:update}
  datasource:
    url: jdbc:${DATABASE_URL:postgresql://localhost:5432/students_db}
    username: ${DATABASE_USERNAME:postgres}
    password: ${DATABASE_PASSWORD:postgres}
    hikari:
      schema: ${DATABASE_SCHEMA:students_schema}
      connection-init-sql: CREATE SCHEMA IF NOT EXISTS ${DATABASE_SCHEMA:students_schema};
      connection-timeout: 10000

student:
  jwt:
    secret: ${JWT_SECRET:modernprogrammingtechnologiesisinterestingandusefullstudentsloveitreadwritecodeenjoyaprogrammerslifeletusnotgetboredwithrestap}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}
