services:
  - type: web
    name: student-backend
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /api/v1/health
    envVars:
      - key: JAVA_VERSION
        value: "21"
      - key: DATABASE_URL
        fromDatabase:
          name: student-db
          property: connectionString
      - key: DATABASE_USERNAME
        fromDatabase:
          name: student-db
          property: user
      - key: DATABASE_PASSWORD
        fromDatabase:
          name: student-db
          property: password
      - key: DATABASE_SCHEMA
        value: students_schema
      - key: JWT_SECRET
        generateValue: true
      - key: CORS_ALLOWED_ORIGINS
        value: https://student-frontend.onrender.com

  - type: web
    name: student-frontend
    runtime: static
    rootDir: frontend
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_API_URL
        value: https://student-backend.onrender.com

databases:
  - name: student-db
    plan: free
    databaseName: students_db
    user: student
